<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Podplayer</title>
  <meta name="description" content="Podcasts and your Google Drive music, free.">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Podplayer">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="main"></main>

  <div id="mini" class="mini" data-act="open-full" hidden>
    <div class="mini-progress"></div>
    <img class="mini-art" alt="">
    <div class="mini-text"><span class="mini-title"></span><span class="mini-sub"></span></div>
    <button class="icon-btn mini-toggle" data-act="toggle" aria-label="Play or pause"></button>
  </div>

  <nav class="tabs">
    <button data-act="tab" data-tab="podcasts" class="active">
      <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2zm0 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM10 18h4l-.6 4h-2.8z"/></svg>
      <span>Podcasts</span>
    </button>
    <button data-act="tab" data-tab="music">
      <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm12-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>Music</span>
    </button>
    <button data-act="tab" data-tab="downloads">
      <svg viewBox="0 0 24 24"><path d="M12 3v11m0 0l-4-4m4 4l4-4M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Downloads</span>
    </button>
    <button data-act="tab" data-tab="settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h10m4 0h2M4 17h4m4 0h8M14 5v4m-6 6v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <section id="full" class="full" aria-label="Now playing">
    <button class="grab" data-act="close-full" aria-label="Close player"></button>
    <div class="full-body"></div>
  </section>

  <div id="sheet" class="sheet"></div>
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
