# Builds the site and deploys it to GitHub Pages, adding mirrored copies of podcast feeds that
# block web apps (see tools/mirror.py). Runs on push, every 30 minutes, and when a "mirror:" issue changes.
name: Deploy site with feed mirror

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  issues:
    types: [opened, edited, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write     # keep-alive commit
  pages: write
  id-token: write
  issues: write       # comment/label on mirror requests

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'tools' --exclude 'apps-script' ./ _site/

      - name: Mirror blocked feeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/mirror.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows after 60 days without commits; nudge it monthly.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep feed mirror schedule active"
            git push
          fi
